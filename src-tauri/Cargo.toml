[package]
name = "inkdoc"
version = "0.1.0"
description = "A minimalist local Markdown editor with Feishu-style rendering"
authors = ["you"]
edition = "2021"

[lib]
name = "inkdoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.12"
notify = "6"
tokio = { version = "1", features = ["full"] }
